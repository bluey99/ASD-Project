<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | moodi</title>

  <link rel="stylesheet" href="../CSS/mainStyle.css" />
  <link rel="stylesheet" href="../CSS/topbar.css" />
  <link rel="stylesheet" href="../CSS/forgotMyPassword.css" />

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <script>
    (function () {
      emailjs.init("YCpq_iEVIAUR-FF5l");
    })();
  </script>
</head>

<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">m</div>
      <div class="brand-name">moodi</div>
    </div>
    <a class="toplink" href="login.html">back to login</a>
  </header>

  <main class="main-area">
    <h1>reset your password</h1>

    <div class="card">

     <!-- Step 1: Ask for Email -->
<div id="step1">
  <p>Enter your email to receive an 8-digit verification code.</p>

  <label>Email:</label>
  <input type="email" id="emailInput" placeholder="example@mail.com" />

  <button class="btn" onclick="sendResetEmail()">Send code</button>

  <p id="sentCodeMsg" class="info"></p>
  <p id="error1" class="error"></p>
  <p id="info1" class="info"></p>
</div>

<!-- Step 2: Enter Code -->
<div id="step2" style="display:none;">
  <p>We sent you an 8-digit code. Enter it below:</p>

  <label>Verification code:</label>
  <input type="text" id="codeInput" placeholder="12345678" />

  <button class="btn" onclick="verifyCode()">Verify</button>

  <p id="error2" class="error"></p>
</div>

<!-- Step 3: Set new password (on your website) -->
<div id="step3" style="display:none;">
  <p>Code verified ✅ Now choose a new password.</p>

  <label>New password:</label>
  <input type="password" id="newPass" placeholder="New password" />

  <label>Confirm new password:</label>
  <input type="password" id="confirmPass" placeholder="Confirm password" />

  <button class="btn" onclick="resetPassword()">Reset password</button>

  <p id="error3" class="error"></p>
  <p id="success3" class="info"></p>
</div>

  </main>

  <!-- IMPORTANT: only THIS script -->
  <script type="module" src="../JS/forgotMyPassword.js"></script>
</body>
</html>
