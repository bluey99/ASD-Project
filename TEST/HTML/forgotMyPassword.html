<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | moodi</title>
  <link rel="stylesheet" href="../CSS/forgotMyPassword.css" />

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  (function(){
    emailjs.init("YCpq_iEVIAUR-FF5l"); 
  })();
</script> 
</head>

<body>

<header class="topbar">
  <div class="logo">moodi</div>
  <a href="login.html" class="back">back to login</a>
</header>

<main class="main-area">
  <h1>reset your password</h1>

  <div class="card">

    <!-- Step 1: Ask for Email -->
    <div id="step1">
      <p>Enter your email address to receive a verification code:</p>

      <label>Email:</label>
      <input type="email" id="emailInput" placeholder="example@mail.com" />

      <button class="btn" onclick="sendCode()">Send Code</button>

      <p id="error1" class="error"></p>
    </div>

    <!-- Step 2: Enter Code -->
    <div id="step2" style="display:none;">
      <p>A verification code has been sent to your email.</p>

      <label>Enter verification code:</label>
      <input type="text" id="codeInput" placeholder="123456" />

      <button class="btn" onclick="verifyCode()">Verify</button>

      <p id="sentCodeMsg" class="info"></p>
      <p id="error2" class="error"></p>
    </div>

    <!-- Step 3: Show Saved Account Info -->
    <div id="step3" style="display:none;">
      <p>Account found!</p>
      <p><strong>User:</strong> <span id="foundName"></span></p>
      <p><strong>Email:</strong> <span id="foundEmail"></span></p>
      <p><strong>Saved Password:</strong> <span id="foundPass"></span></p>

      <button class="btn" onclick="goLogin()">Return to Login</button>
    </div>

  </div>
</main>

<script src="../JS/forgotMyPassword.js"></script>
<script type="module" src="../JS/firebase.js"></script>
</body>
</html>
