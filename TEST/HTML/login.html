<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | moodi</title>
  <link rel="stylesheet" href="../CSS/login.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner container">
      <a href="index.html" class="brand" aria-label="Moodi home">
        <span>moodi</span>
      </a>
      <div class="actions">
        <a href="signup.html" class="login">sign up</a>
      </div>
    </div>
  </header>

  <main class="main-area">
    <h1>log in to moodi</h1>

    <div class="login-card">
      <form id="loginForm">
        <input
          type="email"
          id="loginEmail"
          placeholder="Email"
          autocomplete="username"
          required
        >

        <div class="field">
          <div class="password-wrapper">
            <input
              type="password"
              id="passwordField"
              placeholder="Password"
              autocomplete="current-password"
              required
            >
            <span id="togglePassword" class="toggle-pass">
              <i class="fa-solid fa-eye"></i>
            </span>
          </div>
        </div>

        <a href="forgotMyPassword.html" class="forgot">forgot my password</a>

        <p id="loginError" class="error"></p>

        <button type="submit" class="login-btn">LOG IN</button>
      </form>
    </div>
  </main>

  
<script type="module" src="../JS/login.js"></script>
</body>
</html>
