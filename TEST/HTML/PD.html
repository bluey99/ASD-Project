<!-- PD.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>moodi – Patient</title>

  <!-- Theme FIRST -->
  <link rel="stylesheet" href="../CSS/theme.css" />
  <link rel="stylesheet" href="../CSS/mainStyle.css" />

  <!-- Page CSS -->
  <link rel="stylesheet" href="../CSS/PD.css" />

  <!-- Section CSS -->
  <link rel="stylesheet" href="../CSS/tasks.css?v=2" />
  <link rel="stylesheet" href="../CSS/overview.css" />
  <link rel="stylesheet" href="../CSS/reports.css" />
  <link rel="stylesheet" href="../CSS/feedback.css" />
</head>

<body>
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="topbar-inner container">
      <a href="index.html" class="brand" aria-label="Moodi home">
        <span class="brand-icon">m</span>
        <span class="brand-text">moodi</span>
      </a>

      <div class="actions">
        <a href="login.html" class="logout">log out</a>

        <!-- Notification bell (your existing UI) -->
        <div class="bell" aria-label="notifications" role="button" tabindex="0">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 3a6 6 0 0 0-6 6v3.59l-1.29 1.3A1 1 0 0 0 5 16h14a1 1 0 0 0 .73-1.71L18 12.59V9a6 6 0 0 0-6-6Z" stroke="#334155" stroke-width="1.6"/>
            <path d="M15 16a3 3 0 0 1-6 0" stroke="#334155" stroke-width="1.6"/>
          </svg>

          <div class="notif-box" id="notifBox">
            <h4>Notifications</h4>
            <ul>
              <li><strong>Emily</strong> completed her weekly task.</li>
              <li><strong>Daniel</strong> added a new emotion log.</li>
              <li><strong>Liam</strong> has unread feedback.</li>
              <li><strong>Sofia</strong> updated her report.</li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== Main content ===== -->
  <main class="page pd-page">
    <div class="pd-shell">
      <!-- Tabs -->
      <nav class="tabs" role="tablist" aria-label="Patient sections">
        <button class="tab active" role="tab" data-tab="overview">overview</button>

        <!-- ✅ tasks badge -->
        <button class="tab" role="tab" data-tab="tasks">
  tasks <span id="tasksDot" class="tab-dot hidden" aria-hidden="true"></span>
</button>

        <!-- ✅ reports badge -->
        <button class="tab" role="tab" data-tab="reports">
  reports <span id="reportsDot" class="tab-dot hidden" aria-hidden="true"></span>
</button>

        <button class="tab" role="tab" data-tab="feedbacks">feedbacks</button>
      </nav>

      <!-- Content panel -->
      <section id="panel" class="panel" aria-live="polite">overview</section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
  <script src="../JS/authGuard.js" defer></script>
  <script src="../JS/PD.js" defer></script>
</body>
</html>
